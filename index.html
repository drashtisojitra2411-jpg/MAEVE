<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/maeve-emblem.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MAEVE — Your wardrobe. Intelligently styled. A private AI stylist that reads your wardrobe, the weather, and your taste." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="MAEVE — Your wardrobe. Intelligently styled." />
    <meta property="og:description" content="A private AI stylist that reads your wardrobe, the weather, and your taste to compose looks from what you already own." />
    <meta property="og:type" content="website" />
    <!-- Cormorant Garamond: luxury fashion editorial display serif -->
    <!-- Playfair Display: refined editorial serif for headings -->
    <!-- Inter: modern precision sans-serif for UI elements -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Boot the correct theme before first paint — no flash.
      (function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('maeve-theme')
          if (stored === 'light' || stored === 'dark') {
            theme = stored
          } else {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
        } catch (e) {
          theme = 'dark'
        }
        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.content = theme === 'dark' ? '#0D0B0A' : '#F7F3ED'
      })()
    </script>
    <meta name="theme-color" content="#0D0B0A" />
    <title>MAEVE — Your wardrobe. Intelligently styled.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
